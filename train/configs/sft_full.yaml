# Full fine-tuning (all weights). Needs ~45GB+ -> A100-80GB. fp32 master weights + bf16 autocast.
# Run:  python -m train.sft --config train/configs/sft_full.yaml
model_name: Qwen/Qwen3.5-2B-Base
data_dir: data/processed/sft_v1
output_dir: outputs/sft_full
run_name: sft-full

method: full

optim: adamw_torch_fused     # use adamw_bnb_8bit (pip install bitsandbytes) if you hit out-of-memory
learning_rate: 1.0e-5
adam_beta1: 0.9
adam_beta2: 0.95
weight_decay: 0.01
max_grad_norm: 1.0
lr_scheduler: cosine_with_min_lr
min_lr_ratio: 0.1
warmup_ratio: 0.03
num_epochs: 1

per_device_batch_size: 2
grad_accum_steps: 16         # effective batch = 32 sequences
group_by_length: true

bf16: true
gradient_checkpointing: true

logging_steps: 10
eval_steps: 100
save_steps: 200
save_total_limit: 1          # full checkpoints are large (weights + optimizer state)
report_to: wandb
max_train_minutes: 90

gen_log_steps: 100
gen_prompts_per_source: 3
gen_max_new_tokens: 160
