# Seconds-long CPU/GPU pipeline check on a tiny random model (build it with `python -m tests.tiny_model`).
# Not for real training. Run:  python -m train.sft --config train/configs/sft_debug.yaml --set data_dir=data/processed/debug
model_name: data/tiny_model
data_dir: data/processed/debug
output_dir: outputs/sft_debug
run_name: sft-debug

method: lora
lora_r: 8
lora_alpha: 16
merge_lora: true

learning_rate: 2.0e-3
num_epochs: 1
max_steps: 6
per_device_batch_size: 1
grad_accum_steps: 2
group_by_length: true

bf16: false
gradient_checkpointing: true
logging_steps: 1
eval_steps: 3
save_steps: 3
save_total_limit: 1
report_to: none
num_workers: 0

gen_log_steps: 3
gen_prompts_per_source: 2
gen_max_new_tokens: 24
