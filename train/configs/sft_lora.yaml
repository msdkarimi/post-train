# LoRA SFT: cheap, fits a 24GB card, ~safe default. Run:  python -m train.sft --config train/configs/sft_lora.yaml
model_name: Qwen/Qwen3.5-2B-Base
data_dir: data/processed/sft_v1
output_dir: outputs/sft_lora
run_name: sft-lora

method: lora
lora_r: 64
lora_alpha: 128
lora_dropout: 0.05
lora_target: all-linear
merge_lora: true

# optimizer: AdamW (fused), betas (0.9, 0.95), cosine decay to 10% of peak, 3% warmup, grad-clip 1.0
optim: adamw_torch_fused
learning_rate: 1.0e-4
adam_beta1: 0.9
adam_beta2: 0.95
weight_decay: 0.0
max_grad_norm: 1.0
lr_scheduler: cosine_with_min_lr
min_lr_ratio: 0.1
warmup_ratio: 0.03
num_epochs: 1
max_steps: -1

per_device_batch_size: 2
grad_accum_steps: 16         # effective batch = 32 sequences (2 x 16); small micro-batch: logits over the 248k vocab are huge
group_by_length: true

bf16: true
gradient_checkpointing: true

logging_steps: 10
eval_steps: 100
save_steps: 100
save_total_limit: 2
report_to: wandb
max_train_minutes: 90        # hard stop + save; protects paid GPU time

# what does the model write? fixed val prompts decoded every N steps (+ baseline at step 0) -> W&B tables
gen_log_steps: 100
gen_prompts_per_source: 3
gen_max_new_tokens: 160
